name: Feature request
description: Propose a reusable addition to the public library.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reusable workflow-visualization problem should the library solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Data contract or adapter
        - Layout or routing
        - Renderer interaction
        - Vue wrapper
        - React wrapper
        - Accessibility or localization
        - Build or package tooling
    validations:
      required: true
  - type: checkboxes
    id: fit
    attributes:
      label: Project fit
      options:
        - label: This belongs in a reusable library rather than one host application's business logic.
          required: true
        - label: I reviewed the explicit non-goals in ROADMAP.md.
          required: true
