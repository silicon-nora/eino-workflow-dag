name: RC validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact npm prerelease version matching package.json
        required: true
        type: string
      cycles:
        description: Interaction and lifecycle cycles per browser
        required: true
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Exact Registry package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.18.x
          cache-dependency-path: integrations/go/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate the published release candidate
        run: >-
          npm run validate:rc --
          "${{ inputs.version }}"
          --cycles "${{ inputs.cycles }}"
          --report-dir "$RUNNER_TEMP/rc-validation"
      - if: always()
        name: Retain the validation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-validation-${{ inputs.version }}
          path: ${{ runner.temp }}/rc-validation
          if-no-files-found: error
          retention-days: 30
