<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eino Workflow DAG — 路由预览</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../dist/eino-workflow-dag.css" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #172033;
        background: #eef2f7;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { padding: 20px; }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 20px;
        margin: 0 auto 14px;
        max-width: 1440px;
      }
      .title h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
      .title p { margin: 5px 0 0; color: #637083; font-size: 13px; }
      .actions { display: flex; align-items: center; gap: 8px; }
      .case-picker {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 3px 3px 3px 10px;
        border: 1px solid #d7dee8;
        border-radius: 10px;
        color: #637083;
        background: #fff;
        box-shadow: 0 1px 2px rgb(15 23 42 / 5%);
        font-size: 13px;
      }
      select {
        min-width: 132px;
        border: 0;
        border-radius: 7px;
        padding: 7px 28px 7px 9px;
        color: #172033;
        background: #f1f5f9;
        font: inherit;
        cursor: pointer;
      }
      .direction-group {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid #d7dee8;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(15 23 42 / 5%);
      }
      button {
        border: 0;
        border-radius: 7px;
        padding: 8px 12px;
        color: #475569;
        background: transparent;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: #f1f5f9; }
      button[aria-pressed="true"] { color: #fff; background: #3157d5; }
      .reset { border: 1px solid #d7dee8; background: #fff; }
      .panel {
        position: relative;
        max-width: 1440px;
        height: calc(100vh - 116px);
        min-height: 620px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid #d8e0ea;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 12px 36px rgb(31 41 55 / 8%);
      }
      #dag { width: 100%; height: 100%; }
      .metrics {
        position: absolute;
        z-index: 2;
        right: 14px;
        bottom: 14px;
        display: flex;
        gap: 8px;
        pointer-events: none;
      }
      .metric {
        padding: 7px 10px;
        border: 1px solid #dbe3ee;
        border-radius: 999px;
        color: #526175;
        background: rgb(255 255 255 / 92%);
        box-shadow: 0 2px 8px rgb(15 23 42 / 7%);
        font-size: 12px;
        backdrop-filter: blur(8px);
      }
      .metric strong { color: #172033; font-weight: 650; }
      .metric.good strong { color: #16815d; }
      @media (max-width: 760px) {
        main { padding: 14px; }
        .toolbar { gap: 12px; }
        .actions { width: 100%; overflow-x: auto; }
        .panel { height: calc(100vh - 154px); min-height: 520px; }
        .metrics { right: 8px; bottom: 8px; gap: 5px; }
        .metric { padding: 6px 8px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <div class="title">
          <h1>正交路由预览</h1>
          <p id="case-description">三路并行后汇聚 · 检查 Level 轨道与端口分配</p>
        </div>
        <div class="actions">
          <label class="case-picker">
            Case
            <select id="case">
              <option value="serial">基础串行</option>
              <option value="fan" selected>三路汇聚</option>
              <option value="diamond">分叉再合并</option>
              <option value="nested">嵌套 Workflow</option>
              <option value="production">复杂生产流程</option>
              <option value="stress">密集压力图</option>
            </select>
          </label>
          <div class="direction-group" aria-label="布局方向">
            <button type="button" data-direction="RIGHT" aria-pressed="true">向右</button>
            <button type="button" data-direction="LEFT" aria-pressed="false">向左</button>
            <button type="button" data-direction="DOWN" aria-pressed="false">向下</button>
            <button type="button" data-direction="UP" aria-pressed="false">向上</button>
          </div>
          <button class="reset" type="button" id="reset">适应画布</button>
        </div>
      </div>
      <section class="panel">
        <div id="dag"></div>
        <div class="metrics" aria-live="polite">
          <span class="metric good">正交边 <strong id="orthogonal">—</strong></span>
          <span class="metric">路由点 <strong id="planned">—</strong></span>
          <span class="metric">缓存命中 <strong id="cache-hits">0</strong></span>
        </div>
      </section>
    </main>

    <script src="../../dist/eino-workflow-dag.umd.cjs"></script>
    <script>
      const edge = (from, to, channels = ["data"]) => ({ from, to, channels });
      const makeSnapshot = (nodes, edges) => ({
        schemaVersion: 1,
        workflow: { nodes, edges },
        execution: {
          nodes: nodes.map((node, index) => ({
            path: [node.id],
            status: "success",
            durationMs: 4 + index * 17,
          })),
        },
      });

      const cases = {
        serial: makeSnapshot(
          [
            { id: "input", name: "Input", component: "Lambda" },
            { id: "retrieve", name: "Retrieve", component: "Retriever" },
            { id: "generate", name: "Generate", component: "ChatModel" },
            { id: "output", name: "Output", component: "Lambda" },
          ],
          [
            edge("input", "retrieve", ["control"]),
            edge("retrieve", "generate"),
            edge("generate", "output", ["control", "data"]),
          ],
        ),
        fan: makeSnapshot(
          [
            { id: "request", name: "Request", component: "Lambda" },
            { id: "search", name: "Search", component: "Retriever" },
            { id: "context", name: "Context", component: "Lambda" },
            { id: "policy", name: "Policy", component: "Lambda" },
            { id: "compose", name: "Compose", component: "ChatModel" },
            { id: "response", name: "Response", component: "ChatModel" },
          ],
          [
            edge("request", "search", ["control"]),
            edge("request", "context"),
            edge("request", "policy"),
            edge("search", "compose"),
            edge("context", "compose"),
            edge("policy", "compose"),
            edge("compose", "response", ["control", "data"]),
          ],
        ),
        diamond: makeSnapshot(
          [
            { id: "input", name: "Input", component: "Lambda" },
            { id: "classify", name: "Classify", component: "ChatModel" },
            { id: "direct", name: "Direct", component: "Lambda" },
            { id: "retrieve", name: "Retrieve", component: "Retriever" },
            { id: "tools", name: "Tools", component: "ToolsNode" },
            { id: "merge", name: "Merge", component: "Lambda" },
            { id: "output", name: "Output", component: "ChatModel" },
          ],
          [
            edge("input", "classify", ["control"]),
            edge("classify", "direct", ["control"]),
            edge("classify", "retrieve"),
            edge("classify", "tools"),
            edge("direct", "merge", ["control"]),
            edge("retrieve", "merge"),
            edge("tools", "merge"),
            edge("merge", "output", ["control", "data"]),
          ],
        ),
        nested: {
          schemaVersion: 1,
          workflow: {
            nodes: [
              { id: "input", name: "Input", component: "Lambda" },
              {
                id: "research",
                name: "Research Workflow",
                component: "Workflow",
                workflow: {
                  nodes: [
                    { id: "search", name: "Search", component: "Retriever" },
                    { id: "rank", name: "Rank", component: "Lambda" },
                    { id: "summarize", name: "Summarize", component: "ChatModel" },
                  ],
                  edges: [
                    edge("search", "rank", ["control", "data"]),
                    edge("rank", "summarize", ["control", "data"]),
                  ],
                },
              },
              { id: "answer", name: "Answer", component: "ChatModel" },
            ],
            edges: [
              edge("input", "research", ["control", "data"]),
              edge("research", "answer", ["control", "data"]),
            ],
          },
        },
        production: {
          schemaVersion: 1,
          workflow: {
            nodes: [
              { id: "collect_events", name: "Collect Events", component: "Loader" },
              { id: "resolve_sources", name: "Resolve Sources", component: "Retriever" },
              { id: "select_candidates", name: "Select Candidates", component: "Lambda" },
              { id: "build_signals", name: "Build Signals", component: "Lambda" },
              { id: "route_strategy", name: "Route Strategy", component: "Lambda" },
              {
                id: "batch_analysis",
                name: "Batch Analysis",
                component: "Workflow",
                workflow: {
                  nodes: [
                    { id: "rank_sources", name: "Rank Sources", component: "Lambda" },
                    { id: "prepare_access", name: "Prepare Access", component: "Lambda" },
                    { id: "behavior_context", name: "Behavior Context", component: "Lambda" },
                    { id: "load_summaries", name: "Load Summaries", component: "Retriever" },
                    { id: "load_documents", name: "Load Documents", component: "Retriever" },
                    { id: "load_preferences", name: "Load Preferences", component: "Retriever" },
                    { id: "merge_analysis", name: "Merge Analysis Input", component: "Lambda" },
                    { id: "analyze_items", name: "Analyze Items", component: "ChatModel" },
                  ],
                  edges: [
                    edge("start", "rank_sources", ["control"]),
                    edge("rank_sources", "prepare_access", ["control", "data"]),
                    edge("prepare_access", "behavior_context"),
                    edge("prepare_access", "load_summaries"),
                    edge("prepare_access", "load_documents"),
                    edge("prepare_access", "load_preferences"),
                    edge("behavior_context", "merge_analysis"),
                    edge("load_summaries", "merge_analysis"),
                    edge("load_documents", "merge_analysis"),
                    edge("load_preferences", "merge_analysis"),
                    edge("merge_analysis", "analyze_items", ["control", "data"]),
                    edge("analyze_items", "end", ["control"]),
                  ],
                },
              },
              {
                id: "batch_compose",
                name: "Batch Compose",
                component: "Workflow",
                workflow: {
                  nodes: [
                    { id: "prepare_cards", name: "Prepare Cards", component: "Lambda" },
                    { id: "compose_cards", name: "Compose Cards", component: "ChatModel" },
                    { id: "repair_format", name: "Repair Format", component: "ChatModel" },
                    { id: "enrich_results", name: "Enrich Results", component: "Lambda" },
                  ],
                  edges: [
                    edge("start", "prepare_cards", ["control"]),
                    edge("prepare_cards", "compose_cards", ["control", "data"]),
                    edge("compose_cards", "repair_format", ["control", "data"]),
                    edge("repair_format", "enrich_results", ["control", "data"]),
                    edge("enrich_results", "end", ["control"]),
                  ],
                },
              },
              { id: "update_profile", name: "Update Profile", component: "Lambda" },
              {
                id: "guided_flow",
                name: "Guided Flow",
                component: "Workflow",
                workflow: {
                  nodes: [
                    { id: "rank_sources", name: "Rank Sources", component: "Lambda" },
                    { id: "prepare_access", name: "Prepare Access", component: "Lambda" },
                    { id: "behavior_context", name: "Behavior Context", component: "Lambda" },
                    { id: "load_summaries", name: "Load Summaries", component: "Retriever" },
                    { id: "load_documents", name: "Load Documents", component: "Retriever" },
                    { id: "load_preferences", name: "Load Preferences", component: "Retriever" },
                    { id: "analyze_items", name: "Analyze Items", component: "ChatModel" },
                    { id: "merge_compose", name: "Merge Compose Input", component: "Lambda" },
                    { id: "compose_cards", name: "Compose Cards", component: "ChatModel" },
                    { id: "repair_format", name: "Repair Format", component: "ChatModel" },
                    { id: "enrich_results", name: "Enrich Results", component: "Lambda" },
                  ],
                  edges: [
                    edge("start", "rank_sources", ["control"]),
                    edge("rank_sources", "prepare_access", ["control", "data"]),
                    edge("prepare_access", "behavior_context"),
                    edge("prepare_access", "load_summaries"),
                    edge("prepare_access", "load_documents"),
                    edge("prepare_access", "load_preferences"),
                    edge("behavior_context", "analyze_items"),
                    edge("load_summaries", "analyze_items"),
                    edge("load_preferences", "analyze_items"),
                    edge("load_documents", "merge_compose"),
                    edge("analyze_items", "merge_compose"),
                    edge("merge_compose", "compose_cards", ["control", "data"]),
                    edge("compose_cards", "repair_format", ["control", "data"]),
                    edge("repair_format", "enrich_results", ["control", "data"]),
                    edge("enrich_results", "end", ["control"]),
                  ],
                },
              },
            ],
            edges: [
              edge("start", "collect_events", ["control"]),
              edge("collect_events", "resolve_sources", ["control", "data"]),
              edge("resolve_sources", "select_candidates", ["control", "data"]),
              edge("select_candidates", "build_signals", ["control", "data"]),
              edge("build_signals", "route_strategy", ["control", "data"]),
              edge("batch_analysis", "batch_compose", ["control", "data"]),
              edge("batch_analysis", "update_profile", ["control", "data"]),
              edge("batch_compose", "end", ["control"]),
              edge("update_profile", "end", ["control"]),
              edge("guided_flow", "end", ["control"]),
            ],
            branches: [
              { from: "route_strategy", targets: ["batch_analysis", "guided_flow"] },
            ],
          },
          execution: {
            durationMs: 12480,
            nodes: [
              { path: ["collect_events"], status: "success", durationMs: 830 },
              { path: ["resolve_sources"], status: "success", durationMs: 980 },
              { path: ["select_candidates"], status: "success", durationMs: 0 },
              { path: ["build_signals"], status: "success", durationMs: 0 },
              { path: ["route_strategy"], status: "success", durationMs: 0 },
              { path: ["batch_analysis"], status: "skipped", durationMs: null },
              { path: ["batch_compose"], status: "skipped", durationMs: null },
              { path: ["update_profile"], status: "skipped", durationMs: null },
              { path: ["guided_flow"], status: "success", durationMs: 10650 },
              { path: ["guided_flow", "rank_sources"], status: "success", durationMs: 0 },
              { path: ["guided_flow", "prepare_access"], status: "success", durationMs: 0 },
              { path: ["guided_flow", "behavior_context"], status: "success", durationMs: 0 },
              { path: ["guided_flow", "load_summaries"], status: "success", durationMs: 1280 },
              { path: ["guided_flow", "load_documents"], status: "success", durationMs: 4080 },
              { path: ["guided_flow", "load_preferences"], status: "success", durationMs: 130 },
              { path: ["guided_flow", "analyze_items"], status: "success", durationMs: 3030 },
              { path: ["guided_flow", "merge_compose"], status: "success", durationMs: 0 },
              { path: ["guided_flow", "compose_cards"], status: "success", durationMs: 6350 },
              { path: ["guided_flow", "repair_format"], status: "success", durationMs: 0 },
              { path: ["guided_flow", "enrich_results"], status: "success", durationMs: 0 },
            ],
          },
        },
        stress: makeSnapshot(
          [
            { id: "a", name: "A", component: "Lambda" },
            { id: "b", name: "B", component: "Lambda" },
            { id: "c", name: "C", component: "Lambda" },
            { id: "d", name: "D", component: "Lambda" },
            { id: "e", name: "E", component: "Lambda" },
            { id: "f", name: "F", component: "Lambda" },
            { id: "g", name: "G", component: "Lambda" },
          ],
          [
            edge("a", "b", ["control"]), edge("a", "c"), edge("a", "d"),
            edge("b", "e"), edge("c", "e"), edge("d", "e"),
            edge("b", "f"), edge("c", "f"), edge("d", "f"),
            edge("e", "g"), edge("f", "g"), edge("a", "g"),
          ],
        ),
      };

      const snapshot = cases.fan;
      const descriptions = {
        serial: "基础串行链 · 检查 Level 0 前向端口",
        fan: "三路并行后汇聚 · 检查多 Level 端口分配",
        diamond: "分叉再合并 · 检查多层扇出与扇入",
        nested: "展开的嵌套 Workflow · 检查容器边界路由",
        production: "分支、跳过路径与嵌套扇入 · 模拟生产级工作流",
        stress: "密集压力图 · 检查复杂路由和缓存恢复",
      };

      const dag = EinoWorkflowDAG.createWorkflowDAG(document.querySelector("#dag"), {
        snapshot,
        direction: "RIGHT",
        interaction: { pinTooltipOnNodeClick: false },
      });
      const access = Symbol.for("eino-workflow-dag.cytoscape");

      function updateMetrics() {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const cy = dag[access]();
          let orthogonal = 0;
          let planned = 0;
          cy.edges().forEach((edge) => {
            const points = [
              edge.sourceEndpoint(),
              ...edge.segmentPoints(),
              edge.targetEndpoint(),
            ];
            const valid = points.length >= 2 && points.slice(1).every((point, index) => {
              const previous = points[index];
              return Math.abs(point.x - previous.x) <= 1 ||
                Math.abs(point.y - previous.y) <= 1;
            });
            if (valid) orthogonal += 1;
            if ((edge.scratch("einoWorkflowDAG")?._flowAbsRoute || []).length >= 2) {
              planned += 1;
            }
          });
          document.querySelector("#orthogonal").textContent = `${orthogonal}/${cy.edges().length}`;
          document.querySelector("#planned").textContent = `${planned}/${cy.edges().length}`;
          document.querySelector("#cache-hits").textContent = dag.getDiagnostics().layoutCacheHits;
        }));
      }

      document.querySelectorAll("[data-direction]").forEach((button) => {
        button.addEventListener("click", () => {
          const direction = button.dataset.direction;
          dag.setDirection(direction);
          dag.resetView();
          document.querySelectorAll("[data-direction]").forEach((candidate) => {
            candidate.setAttribute("aria-pressed", String(candidate === button));
          });
          updateMetrics();
        });
      });
      document.querySelector("#case").addEventListener("change", (event) => {
        const caseId = event.target.value;
        dag.update(cases[caseId], { preserveExpanded: false });
        if (caseId === "nested") dag.expandAll();
        dag.resetView();
        document.querySelector("#case-description").textContent = descriptions[caseId];
        updateMetrics();
      });
      document.querySelector("#reset").addEventListener("click", () => dag.resetView());
      updateMetrics();
      window.routingPreview = dag;
    </script>
  </body>
</html>
