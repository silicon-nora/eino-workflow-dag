<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eino Workflow DAG — Vue</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../dist/eino-workflow-dag.css" />
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #f6f8fa;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #app { max-width: 1000px; margin: 0 auto; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "cytoscape": "/node_modules/cytoscape/dist/cytoscape.esm.min.mjs",
          "vue": "/node_modules/vue/dist/vue.esm-browser.prod.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h, ref } from "vue";
      import { EinoWorkflowDAGVue } from "../../dist/vue.js";

      const root = ref({
        schemaVersion: 1,
        workflow: {
          nodes: [
            { id: "input", name: "Input", component: "Lambda" },
            { id: "answer", name: "Answer", component: "ChatModel" },
          ],
          edges: [{ from: "input", to: "answer", channels: ["control", "data"] }],
        },
        execution: {
          nodes: [
            { path: ["input"], status: "success", durationMs: 5 },
            { path: ["answer"], status: "success", durationMs: 30 },
          ],
        },
      });
      const direction = ref("RIGHT");
      const locale = ref();
      const activeNodePath = ref(["answer"]);
      const component = ref();
      window.vueDagEvents = [];
      window.vueDagRoot = root;
      window.vueDagDirection = direction;
      window.vueDagLocale = locale;
      window.vueDagActiveNodePath = activeNodePath;
      window.vueDagComponent = component;

      const app = createApp({
        setup() {
          return () => h("main", [
            h("h1", "Eino Workflow DAG — Vue"),
            h(EinoWorkflowDAGVue, {
              ref: component,
              snapshot: root.value,
              direction: direction.value,
              locale: locale.value,
              activeNodePath: activeNodePath.value,
              style: { height: "420px" },
              layoutCacheSize: 4,
              onReady(instance) {
                window.vueDagInstance = instance;
              },
              onNodeClick(node) {
                window.vueDagEvents.push({ type: "node", path: node.path });
              },
              onError(error) {
                window.vueDagEvents.push({ type: "error", message: error.message });
              },
            }),
          ]);
        },
      });
      window.vueDagApp = app;
      app.mount("#app");
    </script>
  </body>
</html>
