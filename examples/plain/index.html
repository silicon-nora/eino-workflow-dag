<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eino Workflow DAG</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../dist/eino-workflow-dag.css" />
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #f6f8fa;
        color: #1f2328;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
      }

      .cy-wrap {
        height: 640px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Eino Workflow DAG</h1>
      <div class="eino-workflow-dag-flow">
        <div class="cy-wrap">
          <div id="dag" class="cy-root"></div>
        </div>
      </div>
    </main>

    <script src="../../dist/eino-workflow-dag.umd.cjs"></script>
    <script>
      const snapshot = {
        schemaVersion: 1,
        workflow: {
          nodes: [
          { id: "input", name: "Input", component: "Lambda" },
          {
            id: "research",
            name: "Research",
            component: "Workflow",
            workflow: {
              nodes: [
                { id: "search", name: "Search", component: "Retriever" },
                { id: "rank", name: "Rank", component: "Lambda" },
                { id: "summarize", name: "Summarize", component: "ChatModel" },
              ],
              edges: [
                { from: "search", to: "rank", channels: ["control", "data"] },
                { from: "rank", to: "summarize", channels: ["control", "data"] },
              ],
            },
          },
          { id: "answer", name: "Answer", component: "ChatModel" },
        ],
        edges: [
          {
            from: "input",
            to: "research",
            channels: ["control", "data"],
            mappings: [{ fromPath: ["query"], toPath: ["query"] }],
            metadata: { transport: "typed" },
          },
          { from: "research", to: "answer", channels: ["control", "data"] },
          ],
        },
        execution: {
          nodes: [
            { path: ["input"], status: "success", durationMs: 8 },
            { path: ["research"], status: "success", durationMs: 180 },
            { path: ["research", "search"], status: "success", durationMs: 50 },
            { path: ["research", "rank"], status: "success", durationMs: 30 },
            { path: ["research", "summarize"], status: "success", durationMs: 100 },
            { path: ["answer"], status: "success", durationMs: 240 },
          ],
        },
      };

      window.dagSnapshot = snapshot;
      window.dagEvents = [];
      window.dagExpansionEvents = [];

      window.dagInstance = EinoWorkflowDAG.createWorkflowDAG(document.querySelector("#dag"), {
        snapshot,
        direction: "RIGHT",
        interaction: { pinTooltipOnNodeClick: false },
        onExpandedChange(expanded) {
          window.dagExpansionEvents.push(expanded);
        },
        onNodeClick(node) {
          window.lastDagNodeClick = node;
          window.dagEvents.push({ type: "node", path: node.path });
        },
        onEdgeClick(edge) {
          window.lastDagEdgeClick = edge;
          window.dagEvents.push({ type: "edge", id: edge.id });
        },
        onError(error) {
          window.dagEvents.push({ type: "error", message: error.message });
        },
      });
    </script>
  </body>
</html>
